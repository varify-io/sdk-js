workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - prepare
  - test
  - release

variables:
  # renovate: datasource=docker depName=ghcr.io/aquasecurity/trivy
  TRIVY_VERSION: 0.74.0
  # renovate: datasource=docker depName=ghcr.io/betterleaks/betterleaks
  BETTERLEAKS_VERSION: 1.8.1
  pnpm_config_store_dir: '$CI_PROJECT_DIR/.pnpm-store'
  # Holds the registry metadata pnpm's supply-chain check needs for an offline install.
  pnpm_config_cache_dir: '$CI_PROJECT_DIR/.pnpm-cache'

default:
  interruptible: true
  image: public.ecr.aws/docker/library/node:24.20.0-alpine3.24
  before_script:
    - corepack enable pnpm
    - pnpm install --offline --frozen-lockfile

.node-cache: &node-cache
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store
    - .pnpm-cache
  policy: pull

prepare:node:
  stage: prepare
  cache:
    <<: *node-cache
    policy: pull-push
  before_script:
    - corepack enable pnpm
  script:
    - pnpm fetch

test:lint:
  stage: test
  cache: *node-cache
  script:
    - pnpm lint

test:typecheck:
  stage: test
  cache: *node-cache
  script:
    - pnpm typecheck

test:unit:
  stage: test
  cache: *node-cache
  script:
    - pnpm test

test:package:
  stage: test
  cache: *node-cache
  script:
    - pnpm check:package

test:audit:
  stage: test
  cache: *node-cache
  script:
    - pnpm audit

betterleaks:
  stage: test
  image:
    name: ghcr.io/betterleaks/betterleaks:v$BETTERLEAKS_VERSION
    entrypoint: ['']
  needs: []
  variables:
    GIT_DEPTH: 0
  before_script: []
  script:
    - betterleaks git . --no-banner -v --redact=100 --log-opts=HEAD

trivy-secrets:
  stage: test
  image:
    name: ghcr.io/aquasecurity/trivy:$TRIVY_VERSION
    entrypoint: ['']
  needs: []
  variables:
    TRIVY_CACHE_DIR: .tools/cache/trivy
    TRIVY_NO_PROGRESS: 'true'
  cache:
    - key: trivy-db-$TRIVY_VERSION
      when: always
      paths:
        - .tools/cache/trivy/
  before_script: []
  script:
    - trivy filesystem --scanners secret
      --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      --secret-config .trivy/secret-config.yaml
      --table-mode detailed
      .

release:
  stage: release
  cache: *node-cache
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - test:lint
    - test:typecheck
    - test:unit
    - test:package
    - test:audit
    - betterleaks
    - trivy-secrets
  resource_group: release
  # Cancelling between the version push and the npm upload leaves tags without packages.
  interruptible: false
  variables:
    # lerna derives each package's bump from the commits since its last tag.
    GIT_DEPTH: 0
    HUSKY: 0
    GL_TOKEN: $GITLAB_TOKEN
  before_script:
    - apk add --no-cache git
    - corepack enable pnpm
    - pnpm install --offline --frozen-lockfile
  script:
    - git checkout -B "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA"
    - git remote set-url origin "https://release:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
    - echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc
    - pnpm build
    - pnpm exec lerna version --yes
    - pnpm exec lerna publish from-package --yes
